<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rankings - Warriors Dream Series</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    /* Navigation */
    nav {
      background: #1a1a1a;
      padding: 15px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    nav ul {
      list-style: none;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      gap: 30px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #d63031;
    }

    /* Rankings Container */
    .rankings-container {
      width: 100%;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    .rankings-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Footer */
    footer {
      background: #1a1a1a;
      color: white;
      padding: 30px;
      text-align: center;
      margin-top: 50px;
    }

    footer p {
      margin-bottom: 10px;
    }
  </style>
</head>

  <!-- Navigation -->
  <nav>
    <ul>

  </div>

  <footer>
