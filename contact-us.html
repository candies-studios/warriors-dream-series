<!-- CONTACT US CONTENT - Copy this into your contact-us.html body -->

<section class="contact-container">
    <h1>contact</h1>
    
    <div class="contact-content">
        <h2>Need help? Send us a Message</h2>
        
        <div class="contact-info-boxes">
            <div class="info-box">
                <h3>For Fighter Support</h3>
                <a href="mailto:support@warriorsdreamseries.com">support@warriorsdreamseries.com</a>
            </div>
            <div class="info-box">
                <h3>for media enquiries</h3>
                <a href="mailto:sushil@warriorsdreamseries.com">sushil@warriorsdreamseries.com</a>
            </div>
        </div>

        <form class="contact-form">
            <div class="form-group">
                <input type="text" placeholder="Your Name" required>
            </div>
            <div class="form-group">
                <input type="email" placeholder="Your Email" required>
            </div>
            <div class="form-group">
                <input type="text" placeholder="Subject" required>
            </div>
            <div class="form-group">
                <textarea placeholder="Message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn-submit">Send</button>
        </form>
    </div>
</section>
